<!DOCTYPE html>
<html lang="ja"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>iPhone 17</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:radial-gradient(ellipse at 50% 35%,#3b404c 0%,#15161b 75%);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Hiragino Sans","Hiragino Kaku Gothic ProN","PingFang SC","Noto Sans JP","Noto Sans SC","Yu Gothic",sans-serif;-webkit-font-smoothing:antialiased;-webkit-user-select:none;user-select:none}
input,textarea{-webkit-user-select:text;user-select:text;font:inherit}
button{font:inherit;border:0;background:none;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;display:flex;align-items:center;justify-content:center}
#phone{position:relative;width:430px;height:902px;flex:none;border-radius:74px;padding:4px;
 background:linear-gradient(135deg,#dfe0e4 0%,#a3a5ac 25%,#eceef0 50%,#94969d 78%,#d2d3d8 100%);
 box-shadow:0 30px 90px rgba(0,0,0,.65),0 0 0 1px rgba(0,0,0,.5),inset 0 0 2px rgba(255,255,255,.8)}
#bezel{width:100%;height:100%;border-radius:70px;background:#050505;padding:10px}
.hw{position:absolute;background:linear-gradient(90deg,#8d9097,#d4d6da,#8d9097);border-radius:3px;cursor:pointer}
.hw:active{filter:brightness(.8)}
#screen{position:relative;width:402px;height:874px;border-radius:60px;overflow:hidden;background:#000;color:var(--text);
 --bg:#f2f2f7;--card:#fff;--text:#000;--sub:#8a8a8e;--sep:rgba(60,60,67,.16);--fill:#e9e9eb;--blue:#007aff;--glass:rgba(255,255,255,.62);--glassb:rgba(255,255,255,.75);--hi:rgba(0,0,0,.06)}
#screen.dark{--bg:#000;--card:#1c1c1e;--text:#fff;--sub:#98989f;--sep:rgba(84,84,88,.55);--fill:#2c2c2e;--blue:#0a84ff;--glass:rgba(38,38,42,.6);--glassb:rgba(255,255,255,.14);--hi:rgba(255,255,255,.08)}
/* status bar */
#island{position:absolute;top:11px;left:50%;width:124px;height:36px;margin-left:-62px;border-radius:20px;background:#000;z-index:300;transition:width .35s,margin .35s,height .35s}
#island.wide{width:220px;margin-left:-110px}
#sb{position:absolute;left:0;right:0;top:0;height:54px;z-index:250;display:flex;align-items:center;justify-content:space-between;padding:4px 30px 0 46px;color:#fff;font-weight:600;font-size:17px;pointer-events:none;transition:color .2s}
#sb.blk{color:#000}
#sb .r{display:flex;align-items:center;gap:6px}
#sb svg{display:block}
.bat{position:relative;width:27px;height:13px;border-radius:4px;border:1.3px solid currentColor;opacity:.95;display:flex;align-items:center;justify-content:center;font-size:9.5px;font-weight:700}
.bat:after{content:"";position:absolute;right:-4px;top:3.5px;width:2px;height:4.5px;border-radius:0 2px 2px 0;background:currentColor;opacity:.5}
/* layers */
.layer{position:absolute;inset:0}
#wall{position:absolute;inset:0;transition:background .4s}
#lock{z-index:40;color:#fff;transition:transform .45s cubic-bezier(.2,.8,.2,1),opacity .45s;touch-action:none}
#lock.gone{transform:translateY(-100%);opacity:.6}
#lock .ldate{position:absolute;top:84px;width:100%;text-align:center;font-size:21px;font-weight:600;text-shadow:0 1px 6px rgba(0,0,0,.2)}
#lock .ltime{position:absolute;top:108px;width:100%;text-align:center;font-size:104px;font-weight:700;letter-spacing:-2px;line-height:1.05;font-family:"SF Pro Rounded",-apple-system,"Hiragino Sans",sans-serif;color:rgba(255,255,255,.92);text-shadow:0 2px 18px rgba(0,0,0,.18)}
.lnoti{position:absolute;left:12px;right:12px;bottom:170px;border-radius:24px;padding:13px 14px;display:flex;gap:11px;align-items:center;color:#000;cursor:pointer;background:rgba(255,255,255,.55);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%)}
.lnoti .ic{width:38px;height:38px;border-radius:9px;overflow:hidden;flex:none}
.lnoti b{font-size:15px}.lnoti p{font-size:15px;margin-top:1px}.lnoti small{float:right;color:rgba(0,0,0,.5);font-size:13px}
.lbtn{position:absolute;bottom:56px;width:50px;height:50px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.25);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);cursor:pointer}
.lbtn:active{background:rgba(255,255,255,.6)}
.lhint{position:absolute;bottom:26px;width:100%;text-align:center;font-size:14px;font-weight:500;color:rgba(255,255,255,.85);cursor:pointer;animation:hint 2.4s ease-in-out infinite}
@keyframes hint{0%,100%{transform:translateY(0);opacity:.85}50%{transform:translateY(-5px);opacity:.5}}
#home{z-index:10;color:#fff;transition:transform .4s cubic-bezier(.2,.8,.2,1),opacity .3s}
#home.dim{transform:scale(.92);opacity:.0}
.widgets{position:absolute;top:70px;left:26px;right:26px;display:flex;justify-content:space-between}
.wd{width:162px;height:162px;border-radius:26px;padding:14px 15px;box-shadow:0 6px 20px rgba(0,0,0,.18);cursor:pointer;overflow:hidden;position:relative}
.wd.w{background:linear-gradient(180deg,#2f7fe0,#5aa7f5)}
.wd.c{background:#fff;color:#000}
.wd .city{font-size:15px;font-weight:600;display:flex;align-items:center;gap:3px}
.wd .deg{font-size:44px;font-weight:300;line-height:1.05;margin-top:2px}
.wd .sm{font-size:13px;font-weight:600}
.wd .wk{color:#ff3b30;font-size:13px;font-weight:700;letter-spacing:.5px}
.wd .day{font-size:44px;font-weight:300;line-height:1.05}
.wd .ev{margin-top:12px;border-left:3px solid #ff9500;padding-left:7px;font-size:13px;font-weight:600;line-height:1.35}
.wd .ev small{display:block;color:#8a8a8e;font-weight:500}
.wlabel{position:absolute;top:240px;font-size:12px;font-weight:500;width:162px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.grid{position:absolute;top:276px;left:24px;right:24px;display:grid;grid-template-columns:repeat(4,64px);justify-content:space-between;row-gap:24px}
.app{display:flex;flex-direction:column;align-items:center;cursor:pointer;width:64px}
.ic{width:64px;height:64px;border-radius:15px;overflow:hidden;box-shadow:0 3px 10px rgba(0,0,0,.18);position:relative}
.ic svg{width:100%;height:100%;display:block}
.ic:after{content:"";position:absolute;inset:0;border-radius:inherit;box-shadow:inset 0 1px 1px rgba(255,255,255,.45),inset 0 -1px 1px rgba(0,0,0,.08);pointer-events:none}
.app span{margin-top:6px;font-size:12px;font-weight:500;white-space:nowrap;text-shadow:0 1px 3px rgba(0,0,0,.35)}
.app:active .ic{filter:brightness(.75)}
.badge{position:absolute;top:-6px;right:-6px;min-width:22px;height:22px;border-radius:11px;background:#ff3b30;color:#fff;font-size:13px;font-weight:600;display:flex;align-items:center;justify-content:center;padding:0 6px;z-index:2}
.appw{position:relative}
.pdots{position:absolute;bottom:128px;left:50%;transform:translateX(-50%);display:flex;gap:7px;padding:6px 10px;border-radius:12px;background:rgba(255,255,255,.18);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.pdots i{width:7px;height:7px;border-radius:50%;background:rgba(255,255,255,.45)}.pdots i.on{background:#fff}
.dock{position:absolute;left:12px;right:12px;bottom:14px;height:96px;border-radius:38px;display:flex;justify-content:space-around;align-items:center;padding:0 10px;
 background:rgba(255,255,255,.22);backdrop-filter:blur(30px) saturate(180%);-webkit-backdrop-filter:blur(30px) saturate(180%);box-shadow:inset 0 1px 0 rgba(255,255,255,.35),inset 0 0 0 .5px rgba(255,255,255,.3)}
.dock .app span{display:none}
#app{z-index:30;display:none;background:var(--bg);transform-origin:50% 50%;transition:transform .38s cubic-bezier(.2,.85,.25,1),opacity .3s,border-radius .38s;overflow:hidden}
#app.show{display:block}
#app.zoom{transform:scale(.22);opacity:0;border-radius:60px}
#hbar{position:absolute;left:50%;bottom:0;width:180px;margin-left:-90px;height:26px;z-index:400;cursor:pointer;display:flex;align-items:flex-end;justify-content:center;padding-bottom:8px;touch-action:none}
#hbar i{width:140px;height:5px;border-radius:3px;background:#fff;transition:background .2s}
#hbar.blk i{background:#000}
#toast{position:absolute;top:62px;left:50%;transform:translate(-50%,-30px);opacity:0;z-index:500;padding:11px 18px;border-radius:22px;font-size:14px;font-weight:600;white-space:nowrap;max-width:360px;overflow:hidden;text-overflow:ellipsis;
 background:rgba(30,30,32,.82);color:#fff;backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);transition:all .3s;pointer-events:none}
#toast.on{transform:translate(-50%,0);opacity:1}
/* app common */
.aw{position:absolute;inset:0;display:flex;flex-direction:column;background:var(--bg);color:var(--text)}
.top{flex:none;padding-top:54px;position:relative;z-index:5}
.bar{height:50px;display:flex;align-items:center;padding:0 12px;gap:8px;position:relative}
.bar .ttl{position:absolute;left:80px;right:80px;text-align:center;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar .sp{flex:1}
.cb{width:44px;height:44px;border-radius:22px;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer;color:var(--text);
 background:var(--glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);box-shadow:0 2px 12px rgba(0,0,0,.08),inset 0 0 0 .5px var(--glassb)}
.cb:active{transform:scale(.92)}
.cb.pl{width:auto;padding:0 16px;font-size:16px;font-weight:600}
.lt{font-size:34px;font-weight:700;padding:2px 18px 10px;letter-spacing:.2px}
.body{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;padding-bottom:110px;position:relative}
.body::-webkit-scrollbar{display:none}
.srch{margin:0 16px 12px;height:38px;border-radius:19px;background:var(--fill);display:flex;align-items:center;gap:6px;padding:0 12px;color:var(--sub);font-size:16px}
.srch input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:16px;min-width:0}
.grp{margin:0 16px 22px;background:var(--card);border-radius:24px;overflow:hidden}
.ghd{margin:0 34px 7px;font-size:13px;color:var(--sub);text-transform:uppercase}
.gft{margin:-14px 34px 22px;font-size:13px;color:var(--sub);line-height:1.4}
.cell{display:flex;align-items:center;min-height:52px;padding:0 16px;gap:13px;position:relative;cursor:pointer;font-size:16.5px}
.cell:active{background:var(--hi)}
.cell+.cell:before{content:"";position:absolute;top:0;right:0;left:var(--ind,16px);height:.5px;background:var(--sep)}
.cell .tx{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:11px 0}
.cell .vl{color:var(--sub);font-size:16px;white-space:nowrap}
.chev{color:#c4c4c7;flex:none;display:flex}
.si{width:30px;height:30px;border-radius:8px;display:flex;align-items:center;justify-content:center;flex:none;color:#fff}
.tg{width:52px;height:32px;border-radius:16px;background:#e3e3e6;position:relative;flex:none;transition:background .25s}
.dark .tg{background:#39393d}
.tg:after{content:"";position:absolute;left:2px;top:2px;width:28px;height:28px;border-radius:14px;background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.2);transition:transform .25s}
.tg.on{background:#34c759!important}.tg.on:after{transform:translateX(20px)}
.av{border-radius:50%;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:600;flex:none;background:linear-gradient(180deg,#a5abb8,#858a96)}
.tabs{position:absolute;left:16px;right:16px;bottom:26px;height:64px;border-radius:32px;display:flex;align-items:center;padding:0 5px;z-index:20;
 background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 0 0 .5px var(--glassb)}
.tab{flex:1;height:54px;border-radius:27px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:10.5px;font-weight:600;color:var(--text);cursor:pointer}
.tab.on{color:var(--blue);background:var(--hi)}
.ib{flex:none;display:flex;gap:8px;padding:8px 12px 34px;align-items:center;background:var(--bg)}
.ib input{flex:1;height:40px;border-radius:20px;border:1px solid var(--sep);background:var(--card);padding:0 15px;color:var(--text);outline:none;font-size:16px;min-width:0}
.ib .snd{width:36px;height:36px;border-radius:18px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;flex:none;cursor:pointer}
.ib .pls{width:36px;height:36px;border-radius:18px;background:var(--fill);display:flex;align-items:center;justify-content:center;flex:none;color:var(--sub)}
.msgs{padding:10px 12px 14px}
.m{display:flex;margin:5px 0;align-items:flex-end;gap:6px}
.m.me{justify-content:flex-end}
.bb{max-width:74%;padding:9px 14px;border-radius:20px;font-size:16px;line-height:1.38;word-break:break-word;white-space:pre-wrap;-webkit-user-select:text;user-select:text}
.mt{font-size:10.5px;color:var(--sub);white-space:nowrap;line-height:1.25;text-align:right}
.day{text-align:center;font-size:12px;color:var(--sub);margin:12px 0 6px}
.empty{padding:60px 30px;text-align:center;color:var(--sub);font-size:15px;line-height:1.6}
.pop{animation:pop .35s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{0%{transform:scale(.6);opacity:0}100%{transform:scale(1);opacity:1}}
.typing span{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--sub);margin:0 2px;animation:typ 1s infinite}
.typing span:nth-child(2){animation-delay:.15s}.typing span:nth-child(3){animation-delay:.3s}
@keyframes typ{0%,60%,100%{opacity:.3;transform:translateY(0)}30%{opacity:1;transform:translateY(-3px)}}
/* translate */
.trn{font-size:13px;line-height:1.45;opacity:.62;margin-top:5px;padding-top:5px;border-top:.5px dashed currentColor;white-space:pre-wrap;font-weight:400}
h2+.trn{font-size:15px;margin-bottom:8px}
.cb.tron{background:var(--blue);color:#fff}
/* LINE */
.ln{--lg:#06c755}
.ln .msgs{background:#8cabd8;min-height:100%}
.dark .ln .msgs{background:#1d2633}
.ln .bb{background:#fff;color:#000;border-radius:18px}
.ln .me .bb{background:#86e46a;color:#000}
.ln .rd{font-size:10.5px;color:#fff;text-align:right;line-height:1.25;white-space:nowrap}
.dark .ln .rd{color:#aab}
.ln .nm{font-size:11px;color:#fff;margin:0 0 2px 2px}
/* messages */
.im .me .bb{background:var(--blue);color:#fff}
.im .bb{background:var(--fill)}
/* phone */
.keypad{display:grid;grid-template-columns:repeat(3,80px);justify-content:center;gap:16px 26px;margin-top:18px}
.key{width:80px;height:80px;border-radius:40px;background:var(--fill);display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}
.key:active{filter:brightness(1.35)}
.dark .key:active{filter:brightness(1.6)}
.key b{font-size:34px;font-weight:400;line-height:1}
.key small{font-size:10px;font-weight:700;letter-spacing:2px;margin-top:2px}
.call{position:absolute;inset:0;z-index:60;color:#fff;background:linear-gradient(180deg,#3d4757 0%,#1c222c 60%,#11151b 100%);display:flex;flex-direction:column;align-items:center}
.cbtns{display:grid;grid-template-columns:repeat(3,78px);gap:22px 30px;margin-top:auto}
.cbtn{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;cursor:pointer}
.cbtn i{width:78px;height:78px;border-radius:39px;display:flex;align-items:center;justify-content:center;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px)}
.cbtn.on i{background:#fff;color:#1c222c}
.endb{width:78px;height:78px;border-radius:39px;background:#ff3b30;display:flex;align-items:center;justify-content:center;margin:34px 0 70px;cursor:pointer}
.greenb{width:78px;height:78px;border-radius:39px;background:#34c759;display:flex;align-items:center;justify-content:center;cursor:pointer;color:#fff}
/* safari */
.sbar{position:absolute;left:12px;right:12px;bottom:26px;display:flex;gap:8px;align-items:center;z-index:20}
.addr{flex:1;height:48px;border-radius:24px;display:flex;align-items:center;justify-content:center;gap:6px;font-size:16px;font-weight:500;padding:0 16px;cursor:text;min-width:0;
 background:var(--glass);backdrop-filter:blur(24px) saturate(180%);-webkit-backdrop-filter:blur(24px) saturate(180%);box-shadow:0 6px 24px rgba(0,0,0,.12),inset 0 0 0 .5px var(--glassb)}
.addr input{flex:1;border:0;background:none;outline:none;color:var(--text);font-size:16px;min-width:0}
.addr span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sbar .cb{width:48px;height:48px;border-radius:24px}
.cb.dis{opacity:.35;pointer-events:none}
.favs{display:grid;grid-template-columns:repeat(4,1fr);gap:18px 10px;padding:6px 18px 24px}
.fav{display:flex;flex-direction:column;align-items:center;gap:6px;font-size:11.5px;text-align:center;cursor:pointer}
.fav i{width:64px;height:64px;border-radius:16px;display:flex;align-items:center;justify-content:center;font-style:normal;font-size:24px;font-weight:700;color:#fff;box-shadow:0 2px 8px rgba(0,0,0,.1)}
.sh{font-size:21px;font-weight:700;padding:8px 18px 12px}
.card{margin:0 16px 16px;background:var(--card);border-radius:20px;padding:16px;font-size:14px;line-height:1.5}
.web{background:var(--card);min-height:100%}
.news{display:flex;gap:12px;padding:14px 16px;cursor:pointer;border-bottom:.5px solid var(--sep)}
.news .th{width:92px;height:70px;border-radius:10px;overflow:hidden;flex:none}
.news b{font-size:15.5px;line-height:1.4;display:block}
.news small{font-size:12px;color:var(--sub);display:block;margin-top:5px}
.sr{padding:14px 18px;border-bottom:.5px solid var(--sep);cursor:pointer}
.sr small{color:#1a7f37;font-size:12.5px}
.dark .sr small{color:#4cc76b}
.sr b{display:block;color:#1a0dab;font-size:17px;font-weight:500;margin:3px 0}
.dark .sr b{color:#8ab4f8}
.sr p{font-size:14px;color:var(--sub);line-height:1.45}
.art{padding:18px;font-size:16px;line-height:1.8}
.art h2{font-size:24px;line-height:1.35;margin-bottom:8px}
/* instagram */
.igh{display:flex;align-items:center;height:48px;padding:0 14px;gap:16px}
.igh .lg{font-size:26px;font-weight:700;letter-spacing:-.5px;flex:1;font-family:"Snell Roundhand","Savoye LET","Segoe Script",cursive;font-style:italic}
.stories{display:flex;gap:14px;padding:6px 12px 12px;overflow-x:auto;border-bottom:.5px solid var(--sep)}
.stories::-webkit-scrollbar{display:none}
.st{display:flex;flex-direction:column;align-items:center;gap:5px;font-size:11.5px;width:70px;flex:none;cursor:pointer}
.ring{width:70px;height:70px;border-radius:50%;padding:3px;background:linear-gradient(45deg,#feda75,#fa7e1e,#d62976,#962fbf)}
.ring.seen{background:var(--sep)}
.ring>div{width:100%;height:100%;border-radius:50%;border:3px solid var(--card);overflow:hidden;font-size:24px}
.post .ph{display:flex;align-items:center;gap:10px;padding:10px 12px;font-size:14px;font-weight:600}
.post .img{width:402px;height:402px;position:relative;overflow:hidden}
.post .img .hp{position:absolute;left:50%;top:50%;margin:-50px 0 0 -50px;color:#fff;filter:drop-shadow(0 4px 12px rgba(0,0,0,.3));animation:heart .9s forwards;pointer-events:none}
@keyframes heart{0%{transform:scale(0);opacity:0}15%{transform:scale(1.2);opacity:1}30%{transform:scale(.95)}70%{transform:scale(1);opacity:1}100%{transform:scale(1);opacity:0}}
.acts{display:flex;align-items:center;gap:16px;padding:10px 14px 6px}
.acts span{cursor:pointer;display:flex}
.post .cap{padding:0 14px;font-size:14px;line-height:1.45}
.post .cap.sub{color:var(--sub);margin-top:4px}
.post .tm{padding:4px 14px 18px;font-size:11.5px;color:var(--sub)}
.iggrid{display:grid;grid-template-columns:repeat(3,1fr);gap:2px}
.iggrid div{aspect-ratio:1;overflow:hidden;cursor:pointer}
.igtabs{flex:none;height:84px;display:flex;justify-content:space-around;padding:10px 0 34px;border-top:.5px solid var(--sep);background:var(--card)}
.igtabs span{cursor:pointer;display:flex;padding:4px 14px;opacity:.55}.igtabs span.on{opacity:1}
.igp{display:flex;align-items:center;gap:22px;padding:8px 18px}
.igp .n{text-align:center;font-size:13px}.igp .n b{display:block;font-size:17px}
.igbtn{flex:1;height:34px;border-radius:9px;background:var(--fill);font-size:14px;font-weight:600;display:flex;align-items:center;justify-content:center}
/* forum */
.chips{display:flex;gap:8px;padding:0 16px 12px;overflow-x:auto}
.chips::-webkit-scrollbar{display:none}

 const g=(id,c1,c2)=>`<linearGradient id="${id}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${c1}"/><stop offset="1" stop-color="${c2}"/></linearGradient>`;
 if(k===0){const hues=[['#ff9a5a','#ff5e7e','#5b3a8c'],['#ffd27a','#ff8a5c','#3b4e8c'],['#ffb3c7','#c58bf2','#2d3a7a']][i%3];
  s=`<defs><linearGradient id="${u}" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="${hues[2]}"/><stop offset=".55" stop-color="${hues[1]}"/><stop offset="1" stop-color="${hues[0]}"/></linearGradient></defs><rect width="100" height="100" fill="url(#${u})"/><circle cx="${30+r()*40}" cy="60" r="${10+r()*6}" fill="#fff3c4" opacity=".95"/><rect y="63" width="100" height="37" fill="#24305e"/>`;
  for(let j=0;j<7;j++)s+=`<rect x="${r()*80}" y="${66+j*4.5}" width="${8+r()*20}" height="1.2" fill="#ffd9a0" opacity="${.5-j*.05}"/>`}
 else if(k===1){s=`<defs>${g(u,'#7fc4ff','#dff1ff')}</defs><rect width="100" height="100" fill="url(#${u})"/>`;
  const cols=['#5b6f8f','#3e5274','#2c3d5a'];for(let j=0;j<3;j++){const b=55+j*12,p=10+r()*70;s+=`<path d="M-10 100 L${p-30} ${b} L${p} ${b-25-r()*15} L${p+30} ${b+5} L${p+55} ${b-10} L115 100Z" fill="${cols[j]}"/>`;if(j===0)s+=`<path d="M${p-9} ${b-17} L${p} ${b-32} L${p+9} ${b-17} L${p+3} ${b-20} L${p-3} ${b-16}Z" fill="#fff"/>`}
  s+=`<rect y="88" width="100" height="12" fill="#2f6b4a"/>`}
 else if(k===2){s=`<defs>${g(u,'#0b1030','#2a2f6b')}</defs><rect width="100" height="100" fill="url(#${u})"/>`;
  for(let j=0;j<25;j++)s+=`<circle cx="${r()*100}" cy="${r()*45}" r="${r()*.7+.2}" fill="#fff" opacity="${r()*.8+.2}"/>`;
  let xx=0;while(xx<100){const w=8+r()*12,h=25+r()*45;s+=`<rect x="${xx}" y="${100-h}" width="${w}" height="${h}" fill="#141a3a"/>`;for(let a=0;a<6;a++)s+=`<rect x="${xx+1.5+r()*(w-4)}" y="${100-h+3+r()*(h-6)}" width="1.6" height="1.6" fill="#ffd56b" opacity="${r()*.7+.3}"/>`;xx+=w+1}}
 else if(k===3){s=`<defs>${g(u,'#9fd9ff','#e8f7ff')}</defs><rect width="100" height="100" fill="url(#${u})"/><path d="M0 55 Q50 45 100 55 V100 H0Z" fill="#58b15a"/>`;
  const fc=['#ff5e8a','#ffd23f','#ffffff','#ff8c42','#c77dff'];for(let j=0;j<60;j++){const yy=58+r()*42;s+=`<circle cx="${r()*100}" cy="${yy}" r="${.8+(yy-55)/20}" fill="${fc[j%5]}"/>`}}
 else if(k===4){const bg=['#c89f78','#e7d5c1','#8a5a3c'][i%3];s=`<rect width="100" height="100" fill="${bg}"/><circle cx="50" cy="52" r="36" fill="#fff"/><circle cx="50" cy="52" r="29" fill="${['#f2b13c','#d9482b','#e8c070'][i%3]}"/>`;
  for(let j=0;j<8;j++)s+=`<circle cx="${32+r()*36}" cy="${34+r()*36}" r="${3+r()*4}" fill="${['#7cc56b','#fff2d6','#b5452b','#ffe08a'][j%4]}"/>`;
  s+=`<rect x="84" y="10" width="3" height="80" rx="1.5" fill="#6b4226" transform="rotate(12 85 50)"/>`}
 else{s=`<defs>${g(u,'#ffcc80','#e8603c')}</defs><rect width="100" height="100" fill="url(#${u})"/>`;
  for(let j=0;j<18;j++){const cx=r()*100,cy=r()*100,rot=r()*360;s+=`<ellipse cx="${cx}" cy="${cy}" rx="${5+r()*5}" ry="${2.5+r()*2}" fill="${['#c0392b','#e67e22','#f1c40f','#a0401f'][j%4]}" transform="rotate(${rot} ${cx} ${cy})" opacity=".92"/>`}}
 return `<svg viewBox="0 0 100 100" preserveAspectRatio="xMidYMid slice" style="width:100%;height:100%;display:block">${s}</svg>`;
}

 c.msgs.forEach(m=>{h+=m.me?`<div class="m me"><div class="bb ${m.nw?'pop':''}" style="background:linear-gradient(135deg,#7b3fe4,#3a6df0);color:#fff">${esc(x(m.tx))}${trv(m.tx,m.zh)}</div></div>`:`<div class="m">${avatar(c.who,28)}<div class="bb ${m.nw?'pop':''}" style="background:var(--fill)">${esc(x(m.tx))}${trv(m.tx,m.zh)}</div></div>`});

function buildMap(){
 let s=`<rect x="-500" y="-500" width="2000" height="2000" class="land"/>`;
 // blocks
 for(let gx=0;gx<1000;gx+=100)for(let gy=0;gy<1000;gy+=100){if(gx>=180&&gx<420&&gy>=140&&gy<380)continue;s+=`<rect x="${gx+9}" y="${gy+9}" width="82" height="82" rx="4" class="blk"/>`;}
 s+=`<rect x="170" y="130" width="260" height="260" rx="30" class="water"/><rect x="186" y="146" width="228" height="228" rx="22" class="park"/>`;
 s+=`<rect x="409" y="609" width="132" height="182" rx="8" class="park"/>`;
 s+=`<path d="M-500 900 C 100 840 400 980 1500 860 L1500 1000 L-500 1000Z" class="water"/>`;
 for(let i=0;i<=1000;i+=100){s+=`<line x1="${i}" y1="-500" x2="${i}" y2="1500" class="rd"/><line x1="-500" y1="${i}" x2="1500" y2="${i}" class="rd"/>`}
 s+=`<line x1="500" y1="-500" x2="500" y2="1500" class="mj"/><line x1="-500" y1="500" x2="1500" y2="500" class="mj"/><line x1="-200" y1="1100" x2="1200" y2="80" class="mj" opacity=".9"/>`;
 s+=`<line x1="700" y1="-500" x2="640" y2="1500" class="rail"/><line x1="700" y1="-500" x2="640" y2="1500" class="raild"/>`;
 [['丸の内','丸之内',600,300],['銀座','银座',870,640],['有楽町','有乐町',560,660],['八重洲','八重洲',830,380],['大手町','大手町',560,150],['日本橋','日本桥',880,170]].forEach(([a,b,xx,yy])=>{s+=`<text x="${xx}" y="${yy}" class="lbl" data-ja="${a}" data-zh="${b}">${li()?b:a}</text>`});
 return s;
}
V.maps=()=>{const r=S.r.maps;if(!r.init){r.init=1;r.x=201-ME.x;r.y=380-ME.y}
 const pins=PLACES.map(p=>`<g class="pin" data-a="mapSel" data-v="${p.id}" transform="translate(${p.x} ${p.y})"><circle r="${r.sel===p.id?20:15}" fill="${p.c}" stroke="#fff" stroke-width="3"/><text y="6" text-anchor="middle" font-size="${r.sel===p.id?18:14}">${p.e}</text><text y="${r.sel===p.id?40:34}" text-anchor="middle" class="plbl">${esc(x(p.n))}</text></g>`).join('');
 const sp=PLACES.find(p=>p.id===r.sel);
 const route=sp&&r.route?`<polyline points="${ME.x},${ME.y} ${sp.x},${ME.y} ${sp.x},${sp.y}" fill="none" stroke="#1a73ff" stroke-width="9" stroke-linejoin="round" stroke-linecap="round" opacity=".9"/><polyline points="${ME.x},${ME.y} ${sp.x},${ME.y} ${sp.x},${sp.y}" fill="none" stroke="#7fb3ff" stroke-width="3" stroke-dasharray="1 9" stroke-linecap="round"/>`:'';
 let sheet='';
 if(sp){const dist=(Math.abs(sp.x-ME.x)+Math.abs(sp.y-ME.y))*1.6,mins=Math.max(1,Math.round(dist/80));
  sheet=`<div class="msheet"><div style="display:flex;align-items:flex-start;gap:10px;padding:4px 6px 12px"><div style="flex:1"><div style="font-size:22px;font-weight:700">${esc(x(sp.n))}${trv(sp.n)}</div><div style="color:var(--sub);font-size:14px;margin-top:2px">${x(sp.cat)} · ${dist>=1000?(dist/1000).toFixed(1)+' km':Math.round(dist)+' m'}</div></div><div class="cb" style="width:34px;height:34px;background:var(--fill)" data-a="mapClose">${G('x',16)}</div></div>

function interTick(){
 const now=Date.now();if(!VOOM.inext){VOOM.inext=now+Math.floor((30+Math.random()*60)*60000);saveVoom();return}
 if(now<VOOM.inext)return;
 if(quiet(new Date())){VOOM.inext=wakeAfter(now);saveVoom();return}
 VOOM.inter=(VOOM.inter||[]).filter(z=>now-z<864e5);
 const gap=()=>now+Math.floor((4+Math.random()*2)*3600000);
 if(VOOM.inter.length>=4){VOOM.inext=gap();saveVoom();return}
 const mine=VOOM.posts.filter(p=>p.me&&!p.replyAt&&now-p.ts<4*864e5).sort((a,b)=>b.ts-a.ts);
 const sc=p=>p.cm.filter(c=>!c.me).length;
 let p=mine.find(p=>!sc(p));
 if(p){p.replyAt=now;p.auto=1}
 else if((p=mine.find(p=>!p.sLiked))){p.sLiked=true;VOOM.inter.push(now);VOOM.unseen=(VOOM.unseen||0)+1;toast(li()?'志保赞了你的动态':'志保があなたの投稿にいいねしました');drawHome();if(S.app==='line')render()}
 else if((p=mine.find(p=>now-p.ts<36*3600000&&sc(p)<2&&p.cm.length&&!p.cm[p.cm.length-1].me))){p.replyAt=now;p.auto=1}
 VOOM.inext=gap();saveVoom();
}

const quiet=d=>{const h=d.getHours()+d.getMinutes()/60;return h>=1&&h<7.5};
function nextGap(){return Math.floor((3.2+Math.random()*1.8)*3600000)} /* 3.2–5h → ~5–6 per waking day */
function wakeAfter(ts){const d=new Date(ts);if(!quiet(d))return ts;d.setHours(7,30+Math.floor(Math.random()*90),0,0);return d.getTime()}
if(!PRO.next){PRO.next=Date.now()+Math.floor((20+Math.random()*40)*60000);savePro()}

function lastShihoActivity(){let t=0;SH_CH().forEach(([n,cs])=>{const c=cs.find(z=>z.who==='shiho');if(c&&c.msgs.length)t=Math.max(t,c.msgs[c.msgs.length-1].ts||0)});return t}
async function proTick(){
 if(proBusy||Date.now()<PRO.next)return;
 if(quiet(new Date())){PRO.next=wakeAfter(Date.now());savePro();return}
 if(Date.now()-lastShihoActivity()<40*60000){PRO.next=Date.now()+Math.floor((40+Math.random()*40)*60000);savePro();return}
 proBusy=true;
 const backdate=Date.now()-PRO.next>3*3600000&&!quiet(new Date(PRO.next));const ts=backdate?PRO.next:Date.now();
 const r=Math.random();const ch=r<0.7?'line':r<0.9?'msg':'ig';
 const store=ch==='line'?LINE.chats:ch==='msg'?SMS.chats:IGDM.chats;
 let c=store.find(z=>z.who==='shiho');if(!c){c={id:'shiho',who:'shiho',unread:0,msgs:[]};store.push(c)}
 const when=new Date(ts).toLocaleString('ja-JP',{year:'numeric',month:'numeric',day:'numeric',weekday:'short',hour:'2-digit',minute:'2-digit'});
 try{
  const t=await elText(EL_CHAT,{channel:CH[ch],user_name:S.lineName||'',history:shihoTimeline(50)||'（无）',now:when},
   `（现在是 ${when}。这次是你主动给妹妹发消息，她没有先找你。根据你们最近在各个软件和电话里聊的剧情、现在的时间和你自己的生活，像真人一样自然地发起：可以分享刚发生的小事、看到的东西，关心她，问她问题，或提起之前聊过、约过的事。不要和之前说过的话重复，不要说自己在忙。1～2 条短消息，按格式输出JSON。）`);
  const a=t.indexOf('{'),b=t.lastIndexOf('}');let out=JSON.parse(t.slice(a,b+1)).messages||[];
  out=out.map(o=>typeof o==='string'?{text:o}:o).filter(o=>o&&o.text).slice(0,2);
  out.forEach((o,i)=>{c.msgs.forEach(m=>m.nw=0);c.msgs.push({me:0,tx:String(o.text),zh:o.zh||'',t:hm(new Date(ts+i*20000)),ts:ts+i*20000,nw:1})});
  if(out.length){const viewing=(ch==='line'&&S.app==='line'&&S.r.line.chat==='shiho')||(ch==='msg'&&S.app==='msg'&&S.r.msg.chat==='shiho')||(ch==='ig'&&S.app==='ig'&&S.r.ig.dm==='shiho');
   if(!viewing){c.unread=(c.unread||0)+out.length;if(!S.locked)toast((ch==='line'?'LINE':ch==='msg'?(li()?'信息':'メッセージ'):'Instagram')+'：'+pn('shiho'))}
   saveLine();drawHome();if(S.locked)drawLock();if(S.app)render()}
  PRO.next=backdate?Date.now()+Math.floor((30+Math.random()*60)*60000):Date.now()+nextGap();
 }catch(e){console.warn(e);PRO.next=Date.now()+10*60000}
 PRO.next=wakeAfter(PRO.next);savePro();proBusy=false;
}

document.addEventListener('compositionstart',()=>{IME_ON=true},true);
document.addEventListener('compositionend',()=>{setTimeout(()=>{IME_ON=false},0)},true);
document.addEventListener('pointerdown',e=>{const el=e.target.closest('[data-fast]');if(!el)return;e.preventDefault();fastAt=Date.now();const f=A[el.dataset.a];if(f)f(el.dataset.v,el)},true);
document.addEventListener('keydown',e=>{
 if(e.key==='Enter'&&(e.isComposing||IME_ON))return;
 if(e.key==='Enter'&&e.target.dataset&&e.target.dataset.enter){e.preventDefault();A[e.target.dataset.enter]()}
 if(e.key==='Escape'){goHome()}
});
document.addEventListener('input',e=>{const k=e.target.dataset&&e.target.dataset.input;if(k){S[k]=+e.target.value;if(k==='bright')scr.style.filter=`brightness(${.55+S.bright/220})`}});
// home bar: click or swipe up
let hb=null;
$('#hbar').addEventListener('pointerdown',e=>{hb={y:e.clientY}});
$('#hbar').addEventListener('click',()=>goHome());
// lock swipe
let lk=null;
$('#lock').addEventListener('pointerdown',e=>{if(e.target.closest('[data-a]'))return;lk={y:e.clientY};$('#lock').style.transition='none'});
window.addEventListener('pointermove',e=>{if(!lk)return;const dy=Math.min(0,(e.clientY-lk.y)/SCALE);$('#lock').style.transform=`translateY(${dy}px)`});
window.addEventListener('pointerup',e=>{if(!lk)return;const dy=(e.clientY-lk.y)/SCALE;lk=null;const l=$('#lock');l.style.transition='';if(dy<-110)unlock();else l.style.transform=''});
// swipe up from app bottom area also goes home
let ab=null;
scr.addEventListener('pointerdown',e=>{const rc=scr.getBoundingClientRect();if((rc.bottom-e.clientY)/SCALE<40&&!S.locked)ab={y:e.clientY}});
window.addEventListener('pointerup',e=>{if(ab){if((ab.y-e.clientY)/SCALE>50)goHome();ab=null}});

/* ---------- scale ---------- */
function fit(){const s=Math.min((innerWidth-16)/430,(innerHeight-16)/902,1.15);SCALE=s;$('#phone').style.transform=`scale(${s})`}
addEventListener('resize',fit);fit();

/* ---------- clock tick ---------- */
setInterval(()=>{drawSB();{const c=S.r.phone.call;if(c&&c.real){const b=audioBlocked();if(b)resumeAll();if(b!==c.blk){c.blk=b;if(S.app==='phone')render()}}}const lt=$('#lock .ltime');if(lt)lt.textContent=hm();const ct=$('#app .calltime');const c=S.r.phone.call;if(ct&&c&&c.start){const el=Math.floor((Date.now()-c.start)/1000);ct.textContent=Math.floor(el/60)+':'+pad(el%60)}},1000);

$('#wall').style.background=WALLS[S.wall];$('#lock').style.background=WALLS[S.wall];
drawAll();
</script>
</body></html>
